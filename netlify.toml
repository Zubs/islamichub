[build]
command = "npm run build"
publish = "dist"

# ── SPA redirect — all paths serve index.html ────────────────────────────────
# Required for Vue Router createWebHistory (clean URLs like /zakat, not #/zakat)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# ── Security & SEO headers ───────────────────────────────────────────────────
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.metals.live https://hadithapi.com/api https://api.frankfurter.app https://nominatim.openstreetmap.org; img-src 'self' https://avatars.githubusercontent.com data:; frame-ancestors 'none';"

# ── Long cache for Vite-hashed assets (/assets/xxx.abc123.js) ────────────────
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# ── No cache for index.html — deploys go live immediately ────────────────────
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# ── Short cache for SEO & PWA files ──────────────────────────────────────────
[[headers]]
for = "/sitemap.xml"
[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/robots.txt"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/site.webmanifest"
[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/manifest+json"

[[headers]]
for = "/favicon*"
[headers.values]
Cache-Control = "public, max-age=604800"
